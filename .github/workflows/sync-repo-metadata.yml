name: Sync Repo Metadata

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/repo-metadata.json"
      - "README.md"
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  sync:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Sync description, homepage, and topics
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${REPO_ADMIN_TOKEN:-}" ]; then
            echo "REPO_ADMIN_TOKEN is not configured; skipping metadata sync."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["REPO_ADMIN_TOKEN"]

          with open(".github/repo-metadata.json", "r", encoding="utf-8") as handle:
              metadata = json.load(handle)

          def api_request(method: str, path: str, payload: dict) -> None:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "etherwhere-repo-metadata-sync",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  print(f"{method} {path} -> {response.status}")

          api_request(
              "PATCH",
              f"/repos/{repo}",
              {
                  "description": metadata["description"],
                  "homepage": metadata["homepage"],
              },
          )

          api_request(
              "PUT",
              f"/repos/{repo}/topics",
              {"names": metadata["topics"]},
          )
          PY
