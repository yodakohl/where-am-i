[package]
name = "etherwhere"
version = "0.1.0"
edition = "2024"
description = "Rust CLI for network geolocation from RTT latency probing, traceroute corridor hints, and posterior uncertainty."
readme = "README.md"
repository = "https://github.com/yodakohl/where-am-i"
homepage = "https://github.com/yodakohl/where-am-i"
keywords = ["geolocation", "latency", "traceroute", "networking", "cli"]
categories = ["command-line-utilities", "network-programming", "science"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
